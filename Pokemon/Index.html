<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA Emulator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 10px;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        /* Emulator Screen Wrapper */
        #canvas-container {
            position: relative;
            width: 100%;
            padding-top: 66.66%; /* 3:2 GBA Aspect Ratio */
            background: #000;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* Controls Guide */
        .controls-guide {
            margin-top: 15px;
            background: #222;
            padding: 12px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            font-size: 0.85rem;
        }
        .key {
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
    <!-- Loads the core emulator framework from a public CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="container">
        <h1>Pokémon FireRed Version</h1>
        
        <div id="canvas-container">
            <!-- The game engine will automatically inject the gameplay screen here -->
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls-guide">
            <div>DPad: <span class="key">↑ ↓ ← →</span></div>
            <div>A Button: <span class="key">X</span></div>
            <div>B Button: <span class="key">Z</span></div>
            <div>L / R: <span class="key">A / S</span></div>
            <div>Select: <span class="key">Shift</span></div>
            <div>Start: <span class="key">Enter</span></div>
            <div>Save Game: <span class="key">F5</span></div>
            <div>Load Game: <span class="key">F8</span></div>
        </div>
    </div>

    <script>
        // Initialize the Emulator once the page loads
        window.addEventListener("load", function() {
            var romUrl = "firered.gba"; // Your local game file
            var coreUrl = "https://jsdelivr.net";

            // Configure WebRetro to run the GBA game
            WebRetro.Init({
                canvas: document.getElementById("canvas"),
                core: coreUrl,
                rom: romUrl,
                autoStart: true,
                onReady: function() {
                    console.log("Game loaded successfully!");
                }
            });
        });
    </script>

</body>
</html>
