<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon FireRed - Unblocked Arcade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            width: 640px;
            height: 480px;
            max-width: 100%;
            max-height: 100%;
        }
        #emulator {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- EmulatorJS will automatically generate the UI here -->
        <div id="emulator"></div>
    </div>

    <script>
        // Setup configuration parameters for EmulatorJS
        EJS_player = '#emulator';
        EJS_core = 'gba'; 
        
        // This targets your game file located in the exact same GitHub folder
        EJS_gameUrl = 'firered.gba'; 
        
        // Fixes the white screen issue by loading system files directly from the global CDN
        EJS_pathtodata = 'https://emulatorjs.org'; 
    </script>
    
    <!-- Loads the primary execution engine from the official CDN -->
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
